[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "qtviz"
version = "2.0.0"
description = "Native-Qt declarative plotting — one immutable API across pyqtgraph, matplotlib, and webengine backends."
# readme is dynamic: README.md keeps repo-relative image/link paths (so it
# renders on GitHub); the fancy-pypi-readme hook rewrites them to absolute
# URLs in the built metadata (so it renders on PyPI).
dynamic = ["readme"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mark Jajeh" }]
keywords = [
    "pyside6", "qt", "pyqtgraph", "matplotlib", "plotting", "visualization",
    "declarative", "plotly", "bokeh", "holoviews", "datashader", "dask", "xarray",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "PySide6 >=6.6",
    "numpy >=1.24",
    "pyqtgraph >=0.13",
]

[project.entry-points."qtviz.backends"]
# [D125]: backends register through entry points — a third-party backend needs
# zero qtviz edits. `backends.register()` stays for tests/embedding.
pyqtgraph = "qtviz.backends.pyqtgraph:backend"
matplotlib = "qtviz.backends.matplotlib:backend"
webengine = "qtviz.backends.webengine.render:backend"

[project.optional-dependencies]
plotly = ["plotly >=5.20"]
bokeh = ["bokeh >=3.4"]
holoviews = ["holoviews >=1.18"]
# hvplot one-liner entry ([D43] Path A): df.hvplot(...) → from_holoviews → native widget
hvplot = ["hvplot >=0.10"]
# The webengine backend hosts web figure libraries in a QWebEngineView. PySide6
# (>=6.6, a hard dep) already ships QtWebEngine via PySide6-Addons; this extra
# adds the figure libraries it can host (roadmap Phase 5, D30).
webengine = [
    "plotly >=5.20",
    "bokeh >=3.4",
    "holoviews >=1.18",
]
# Everything a user might want except the `dev`/`docs` tooling — keep in sync with
# the individual extras (webengine + hvplot + matplotlib + dask + xarray + datashader).
all = [
    "plotly >=5.20",
    "bokeh >=3.4",
    "holoviews >=1.18",
    "hvplot >=0.10",
    "matplotlib>=3.8",
    "dask[dataframe]>=2024.1",
    "xarray>=2024.1",
    "zarr>=3",
    "datashader>=0.16",
]
dev = [
    "pytest >=8.0",
    "pytest-qt >=4.4",
    "pytest-cov >=5.0",
    "ruff >=0.5",
    "mypy >=1.11",
]
docs = [
    "mkdocs-material >=9.5",
    "mkdocstrings[python] >=0.25",
]
matplotlib = [
    "matplotlib>=3.8",
]
dask = [
    "dask[dataframe]>=2024.1",
]
xarray = [
    "xarray>=2024.1",
    "zarr>=3",
]
datashader = [
    "datashader>=0.16",
]

[project.urls]
Homepage = "https://github.com/jawjay/qtviz"
Documentation = "https://jawjay.github.io/qtviz/"
Repository = "https://github.com/jawjay/qtviz"
Issues = "https://github.com/jawjay/qtviz/issues"
Changelog = "https://github.com/jawjay/qtviz/blob/main/CHANGELOG.md"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Repo-relative → absolute, for the PyPI render only. Patterns are regexes.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="docs/images/'
replacement = 'src="https://raw.githubusercontent.com/jawjay/qtviz/main/docs/images/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(examples/'
replacement = '](https://github.com/jawjay/qtviz/blob/main/examples/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(examples\)'
replacement = '](https://github.com/jawjay/qtviz/tree/main/examples)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(design\)'
replacement = '](https://github.com/jawjay/qtviz/tree/main/design)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(CONTRIBUTING\.md\)'
replacement = '](https://github.com/jawjay/qtviz/blob/main/CONTRIBUTING.md)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(LICENSE\)'
replacement = '](https://github.com/jawjay/qtviz/blob/main/LICENSE)'

[tool.hatch.build.targets.wheel]
packages = ["src/qtviz"]

[tool.hatch.build.targets.sdist]
include = [
    "src/qtviz",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# `_runtime.py` files are embedded JavaScript as Python strings — line length
# (E501) is meaningless and wrapping would mangle the JS.
"**/_runtime.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not benchmark'"
markers = [
    "gui: requires a Qt event loop (pytest-qt) and PySide6 WebEngine",
    # qtviz acceptance benchmarks (spec-first; skip until the qtviz package lands)
    "tier1: pure-core spec, no QApplication needed (fast)",
    "tier2: requires a Qt event loop + a registered backend",
    "conformance: parametrized contract suite every backend/adapter must pass",
    "benchmark: performance harness; opt-in via `-m benchmark`, excluded by default",
]

[tool.mypy]
# 1.0 gate ([D80]): pragmatic, local-blocking (`uv run mypy src/qtviz`, see
# RELEASING.md). Default strictness; optional-dep imports tolerated. Tighten
# at will — zero errors is the bar, not strict mode.
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
files = ["src/qtviz"]

[tool.coverage.run]
source = ["src/qtviz"]
omit = ["src/qtviz/backends/webengine/ext/*", "src/qtviz/backends/webengine/core/*"]

[tool.coverage.report]
# 1.0 gate ([D81]): the floor sits just under measured coverage (90% at 1.0) —
# it catches regressions, it doesn't chase a number. webengine bridge internals
# are display-gated offscreen and excluded from the measurement.
fail_under = 88
exclude_also = ["pragma: no cover", "raise NotImplementedError"]
