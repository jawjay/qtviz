[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qtviz"
version = "0.1.0"
description = "Native-Qt declarative plotting — one immutable API across pyqtgraph, matplotlib, and webengine backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mark Jajeh" }]
keywords = ["pyside6", "qt", "pyqtgraph", "matplotlib", "plotting", "visualization", "qtviz"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "PySide6 >=6.6",
    "numpy >=1.24",
    "pyqtgraph >=0.13",
]

[project.optional-dependencies]
plotly = ["plotly >=5.20"]
bokeh = ["bokeh >=3.4"]
holoviews = ["holoviews >=1.18"]
# hvplot one-liner entry ([D43] Path A): df.hvplot(...) → from_holoviews → native widget
hvplot = ["hvplot >=0.10"]
# The webengine backend hosts web figure libraries in a QWebEngineView. PySide6
# (>=6.6, a hard dep) already ships QtWebEngine via PySide6-Addons; this extra
# adds the figure libraries it can host (roadmap Phase 5, D30).
webengine = [
    "plotly >=5.20",
    "bokeh >=3.4",
    "holoviews >=1.18",
]
# Everything a user might want except the `dev`/`docs` tooling — keep in sync with
# the individual extras (webengine + hvplot + matplotlib + dask + xarray + datashader).
all = [
    "plotly >=5.20",
    "bokeh >=3.4",
    "holoviews >=1.18",
    "hvplot >=0.10",
    "matplotlib>=3.11.0",
    "dask[dataframe]>=2026.6.0",
    "xarray>=2026.4.0",
    "zarr>=3.1.6",
    "datashader>=0.19.1",
]
dev = [
    "pytest >=8.0",
    "pytest-qt >=4.4",
    "ruff >=0.5",
]
docs = [
    "mkdocs-material >=9.5",
    "mkdocstrings[python] >=0.25",
]
matplotlib = [
    "matplotlib>=3.11.0",
]
dask = [
    "dask[dataframe]>=2026.6.0",
]
xarray = [
    "xarray>=2026.4.0",
    "zarr>=3.1.6",
]
datashader = [
    "datashader>=0.19.1",
]

[project.urls]
Homepage = "https://github.com/jawjay/qtviz"
Documentation = "https://github.com/jawjay/qtviz#readme"
Repository = "https://github.com/jawjay/qtviz"
Issues = "https://github.com/jawjay/qtviz/issues"
Changelog = "https://github.com/jawjay/qtviz/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
# The Qt WebEngine bridge now lives under qtviz.backends.webengine; src/qtwebplot
# is a thin deprecation shim re-exporting from there, kept packaged for two
# releases (roadmap Phase 6) so old `import qtwebplot` code keeps working.
packages = ["src/qtviz", "src/qtwebplot"]

[tool.hatch.build.targets.sdist]
include = [
    "src/qtviz",
    "src/qtwebplot",
    "README.md",
    "pyproject.toml",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# `_runtime.py` files are embedded JavaScript as Python strings — line length
# (E501) is meaningless and wrapping would mangle the JS.
"**/_runtime.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not benchmark'"
markers = [
    "gui: requires a Qt event loop (pytest-qt) and PySide6 WebEngine",
    # qtviz acceptance benchmarks (spec-first; skip until the qtviz package lands)
    "tier1: pure-core spec, no QApplication needed (fast)",
    "tier2: requires a Qt event loop + a registered backend",
    "conformance: parametrized contract suite every backend/adapter must pass",
    "benchmark: performance harness; opt-in via `-m benchmark`, excluded by default",
]
