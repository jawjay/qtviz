site_name: qtviz
site_description: Native-Qt declarative plotting — one immutable API across pyqtgraph, matplotlib, and webengine.
repo_url: https://github.com/jawjay/qtviz
repo_name: jawjay/qtviz
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Gallery: gallery.md
  - API reference: api.md
  - Writing a backend: backends.md
  - Stability policy: stability.md
  - Design notes: design.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false
            heading_level: 3
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true
