name: CI

# The PR/main feedback loop: ruff + mypy + the offscreen test suite + a strict
# docs build. The FULL release gate list (benchmarks, coverage floor) still
# runs locally before tagging — see RELEASING.md.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install (dev)
        run: uv sync --frozen --extra dev --extra matplotlib
      - name: ruff
        run: uv run ruff check src tests examples
      - name: mypy
        run: uv run mypy src/qtviz

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      # Qt runtime libraries PySide6 links against on a bare runner (libnss3/
      # libasound2t6 come in via QtWebEngine even though those tests self-skip
      # offscreen). Trim only after a green run without the removed package.
      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0t64 libdbus-1-3 libxkbcommon0 \
            libfontconfig1 libnss3 libasound2t64 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxkbfile1
      - name: Install (all extras)
        run: uv sync --frozen --all-extras --python ${{ matrix.python }}
      - name: pytest (offscreen; coverage floor on 3.11)
        run: |
          if [ "${{ matrix.python }}" = "3.11" ]; then
            uv run pytest -q --cov
          else
            uv run pytest -q
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      # mkdocstrings imports qtviz to autodoc it, so runtime deps come too.
      - name: Install (docs + runtime deps)
        run: uv sync --frozen --extra docs --extra matplotlib
      - name: mkdocs build --strict
        run: uv run mkdocs build --strict
